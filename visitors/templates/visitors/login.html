<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guard Login - Society Log</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #343a40; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; text-align: center; margin-bottom: 20px;}
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        /* Notice the input types are standard Django auth fields */
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1em; }
        .btn { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 1.1em; cursor: pointer; font-weight: bold; margin-top: 10px;}
        .btn:hover { background-color: #0056b3; }
        .error-msg { color: #dc3545; background-color: #f8d7da; padding: 10px; border-radius: 4px; text-align: center; margin-bottom: 15px; border: 1px solid #f5c6cb; font-weight: bold;}
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Society Users Access</h2>
        
        <!-- Django automatically passes form.errors if the user types the wrong password -->
        {% if form.errors %}
            <div class="error-msg">Invalid username or password. Please try again.</div>
        {% endif %}

        <!-- The action points directly to the built-in login URL we set up earlier -->
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" id="id_username" name="username" required placeholder="Enter guard username">
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" id="id_password" name="password" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn">Log In</button>
        </form>
    </div>

</body>
</html>
