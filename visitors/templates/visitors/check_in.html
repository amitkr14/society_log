<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Visitor Check-In</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; padding: 40px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { margin-top: 0; color: #333; text-align: center; margin-bottom: 20px;}
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1em; }
        .btn { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 1.1em; cursor: pointer; font-weight: bold; margin-top: 10px;}
        .btn:hover { background-color: #218838; }
        .back-link { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Register New Visitor</h2>
        
        <!-- The form sends data back to our 'check_in' view using the POST method -->
        <form method="POST" action="{% url 'check_in' %}">
            <!-- CSRF Token is REQUIRED by Django for security against hackers! -->
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Visitor Full Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Amit Kumar">
            </div>

            <div class="form-group">
                <label for="person_to_meet">Person to Meet (Name/Flat No.)</label>
                <input type="text" id="person_to_meet" name="person_to_meet" required placeholder="e.g. Mr. Piyush (Flat 1-B)">
            </div>

            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input type="text" id="phone_number" name="phone_number" required placeholder="e.g. 9876543210">
            </div>
            <div class="form-group">
                <label>Country</label>
                <select id="country" name="country" class="form-control">
                <option value="">Select Country</option>
                <option value="India">India</option>
                <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group" id="state_wrapper" style="display:none;">
                <label>State</label>
                <select id="state" name="state" class="form-control">
                <option value="">Select State</option>
                </select>
            </div>

            <div class="form-group" id="district_wrapper" style="display:none;">
                <label>District</label>
                <select id="district" name="district" class="form-control">
                <option value="">Select District</option>
                </select>
            </div>

            <div class="form-group">
                <label>Exact Address</label>
                <input type="text" name="address_line" class="form-control" placeholder="Flat No, Building Name, Street">
            </div>

            <div class="form-group">
                <label for="purpose">Purpose of Visit</label>
                <select id="purpose" name="purpose" required>
                    <option value="Delivery">Delivery</option>
                    <option value="Meeting">Meeting</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Personal Visit">Personal Visit</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- This div is hidden by default using display: none; -->
            <div class="form-group" id="otherPurposeDiv" style="display: none;">
                <label for="other_purpose">Please Specify 'Other' Purpose</label>
                <input type="text" id="other_purpose" name="other_purpose" placeholder="Type specific reason...">
            </div>

            <button type="submit" class="btn">Check In Visitor</button>
        </form>

        <a href="{% url 'dashboard' %}" class="back-link">← Cancel and Return to Dashboard</a>
    </div>

    <!-- The JavaScript to handle the dropdown magic -->
    <script>
        const purposeSelect = document.getElementById('purpose');
        const otherPurposeDiv = document.getElementById('otherPurposeDiv');
        const otherPurposeInput = document.getElementById('other_purpose');

        purposeSelect.addEventListener('change', function() {
            if (this.value === 'Other') {
                otherPurposeDiv.style.display = 'block'; 
                otherPurposeInput.required = true;       
            } else {
                otherPurposeDiv.style.display = 'none';  
                otherPurposeInput.value = '';            
                otherPurposeInput.required = false;      
            }
        });
    </script>
    <script>
    document.addEventListener('DOMContentLoaded', async function() {
        const countrySelect = document.getElementById('country');
        const stateWrapper = document.getElementById('state_wrapper');
        const stateSelect = document.getElementById('state');
        const districtWrapper = document.getElementById('district_wrapper');
        const districtSelect = document.getElementById('district');

        let locationData = null;

        // Fetch the data from the external API (Typo Fixed in URL!)
        try {
            const response = await fetch('https://raw.githubusercontent.com/sab99r/Indian-States-And-Districts/master/states-and-districts.json');
            
            // Safety check: Ensure the response is actually OK before parsing
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const data = await response.json();
            locationData = data.states; 
            console.log("Location data loaded successfully!");
        } catch (error) {
            console.error("Failed to load location API:", error);
        }

        // Listen for Country changes
        countrySelect.addEventListener('change', function() {
            stateSelect.innerHTML = '<option value="">Select State</option>';
            districtWrapper.style.display = 'none';
            
            if (this.value === 'India' && locationData) {
                stateWrapper.style.display = 'block'; 
                
                locationData.forEach(stateObj => {
                    stateSelect.add(new Option(stateObj.state, stateObj.state));
                });
            } else {
                stateWrapper.style.display = 'none';
            }
        });

        // Listen for State changes
        stateSelect.addEventListener('change', function() {
            districtSelect.innerHTML = '<option value="">Select District</option>';
            
            if (this.value) {
                districtWrapper.style.display = 'block'; 
                
                const selectedStateData = locationData.find(s => s.state === this.value);
                if (selectedStateData && selectedStateData.districts) {
                    selectedStateData.districts.forEach(dist => {
                        districtSelect.add(new Option(dist, dist));
                    });
                }
            } else {
                districtWrapper.style.display = 'none';
            }
        });
    });
</script>
</body>
</html>
