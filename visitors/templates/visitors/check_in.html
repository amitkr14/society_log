<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Visitor Check-In</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; padding: 40px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { margin-top: 0; color: #333; text-align: center; margin-bottom: 20px;}
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1em; }
        .btn { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 1.1em; cursor: pointer; font-weight: bold; margin-top: 10px;}
        .btn:hover { background-color: #218838; }
        .back-link { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Register New Visitor</h2>
        
        <!-- The form sends data back to our 'check_in' view using the POST method -->
        <form method="POST" action="{% url 'check_in' %}">
            <!-- CSRF Token is REQUIRED by Django for security against hackers! -->
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Visitor Full Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Amit Kumar">
            </div>

            <div class="form-group">
                <label for="person_to_meet">Person to Meet (Name/Flat No.)</label>
                <input type="text" id="person_to_meet" name="person_to_meet" required placeholder="e.g. Mr. Piyush (Flat 1-B)">
            </div>

            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input type="text" id="phone_number" name="phone_number" required placeholder="e.g. 9876543210">
            </div>

            <div class="form-group">
                <label for="purpose">Purpose of Visit</label>
                <select id="purpose" name="purpose" required>
                    <option value="Delivery">Delivery</option>
                    <option value="Meeting">Meeting</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Personal Visit">Personal Visit</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- This div is hidden by default using display: none; -->
            <div class="form-group" id="otherPurposeDiv" style="display: none;">
                <label for="other_purpose">Please Specify 'Other' Purpose</label>
                <input type="text" id="other_purpose" name="other_purpose" placeholder="Type specific reason...">
            </div>

            <button type="submit" class="btn">Check In Visitor</button>
        </form>

        <a href="{% url 'dashboard' %}" class="back-link">← Cancel and Return to Dashboard</a>
    </div>

    <!-- The JavaScript to handle the dropdown magic -->
    <script>
        const purposeSelect = document.getElementById('purpose');
        const otherPurposeDiv = document.getElementById('otherPurposeDiv');
        const otherPurposeInput = document.getElementById('other_purpose');

        purposeSelect.addEventListener('change', function() {
            if (this.value === 'Other') {
                otherPurposeDiv.style.display = 'block'; 
                otherPurposeInput.required = true;       
            } else {
                otherPurposeDiv.style.display = 'none';  
                otherPurposeInput.value = '';            
                otherPurposeInput.required = false;      
            }
        });
    </script>
</body>
</html>
